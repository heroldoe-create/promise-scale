# The scale is weighed by its own rule, on every push.
#
# Two jobs on purpose:
#   - the scale's own planted failures (can it be shown a failure?)
#   - the worked example's planted failures (does the shape hold for a user?)
name: planted failures

on:
  push:
  pull_request:

jobs:
  planted:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: the scale, weighed by its own rule
        run: python3 test_promise_scale.py
      - name: the example's planted failures
        run: python3 example.py --test
      # Run it twice. On a clean machine the first run cannot yet tell that it
      # has ever run — nothing is on record until it finishes once — so it
      # exits 3 and says so, and demanding exactly 3 is the end-to-end proof
      # that the scale watches itself. The second run can see the first, and
      # everything is kept. If the self-watch ever stops working, the first
      # run quietly exits 0 and this step is what catches it.
      - name: and the example runs, and it notices whether it ran
        run: |
          python3 example.py --all --brief && rc=0 || rc=$?   # -e must not eat it
          test "$rc" -eq 3
          python3 example.py --all --brief
